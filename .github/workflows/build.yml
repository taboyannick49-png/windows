name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Structure Android Project
      run: |
        # 1. Création de l'arborescence standard
        mkdir -p app/src/main/java app/src/main/res

        # 2. Déplacement automatique des fichiers sources trouvés
        find . -maxdepth 3 -name "AndroidManifest.xml" ! -path "./app/*" -exec mv {} app/src/main/ \; 2>/dev/null || true
        find . -maxdepth 3 -name "*.java" ! -path "./app/*" -exec mv {} app/src/main/java/ \; 2>/dev/null || true
        find . -maxdepth 3 -name "*.kt" ! -path "./app/*" -exec mv {} app/src/main/java/ \; 2>/dev/null || true

        # 3. Fichier settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "windows"
        include ':app'
        EOF

        # 4. Fichier build.gradle racine
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # 5. Fichier app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.windows'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.windows"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

    - name: Build APK
      run: gradle :app:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: 'app/build/outputs/apk/debug/*.apk'
